[workspace]
resolver = "3"
members = [
    "crates/graphy-cli",
    "crates/graphy-core",
    "crates/graphy-plugin-api",
    "crates/plugins/*",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"
repository = "https://github.com/DeveloperBeau/graphy"
description = "Turn a folder of code into a queryable knowledge graph, fast."

[workspace.dependencies]
graphy-core = { path = "crates/graphy-core" }
graphy-plugin-api = { path = "crates/graphy-plugin-api" }

anyhow = "=1.0.104"
thiserror = "=2.0.20"
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
rayon = "=1.12.0"
walkdir = "=2.5.0"
ignore = "=0.4.33"
petgraph = { version = "=0.8.3", features = ["serde-1"] }
indexmap = { version = "=2.14.0", features = ["serde"] }
ahash = "=0.8.12"
once_cell = "=1.21.4"
regex = "=1.13.1"

tree-sitter = "=0.26.11"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-bash = "=0.25.1"
tree-sitter-json = "=0.24.8"
tree-sitter-swift = "=0.7.3"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-php = "=0.24.2"
tree-sitter-scala = "=0.26.2"
tree-sitter-lua = "=0.5.0"
tree-sitter-zig = "=1.1.2"
tree-sitter-elixir = "=0.3.5"
tree-sitter-objc = "=3.0.2"
tree-sitter-julia = "=0.23.1"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-groovy = "=0.1.2"
tree-sitter-powershell = "=0.26.4"
tree-sitter-verilog = "=1.0.3"
tree-sitter-fortran = "=0.6.0"
tree-sitter-sequel = "=0.3.11"
tree-sitter-r = "=1.3.0"
tree-sitter-dart = "=0.2.0"
tree-sitter-vue = "=0.0.3"
tree-sitter-svelte-ng = "=1.0.2"
tree-sitter-md = { version = "=0.5.3", features = ["parser"] }
tree-sitter-yaml = "=0.7.2"
tree-sitter-pascal = "=0.10.2"
tree-sitter-perl = "=1.1.2"
tree-sitter-haskell = "=0.23.1"
tree-sitter-ocaml = "=0.25.0"
tree-sitter-erlang = "=0.20.0"
tree-sitter-toml-ng = "=0.7.0"

blake3 = "=1.8.6"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
libloading = "=0.9.0"
dirs = "=6.0.0"
sha2 = "=0.11.0"
toml = "=1.1.4"
hex = "=0.4.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
