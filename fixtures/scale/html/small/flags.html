<h1>Flag reference</h1>
<p>Every flag has a long form; short forms cover the frequent ones.</p>
<section id="flags-wrapping">
<h2>Wrapping flags</h2>
<p>--width N rewraps at N columns and --no-wrap passes long lines through untouched.</p>
</section>
<section id="flags-colour">
<h2>Colour flags</h2>
<p>--rules FILE loads custom colour rules; the format is described on the <a href="colours.html">colours page</a>.</p>
