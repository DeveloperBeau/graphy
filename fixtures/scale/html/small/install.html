<p>Prebuilt binaries are published for Linux and macOS on every tagged release.</p>
<section id="install-binaries">
<h2>From a release</h2>
<p>Download the archive, unpack it onto your PATH and run inkroll --version.</p>
</section>
<section id="install-source">
<h2>From source</h2>
<p>You need a C compiler and make. After installing, continue with <a href="usage.html">everyday usage</a>.</p>
