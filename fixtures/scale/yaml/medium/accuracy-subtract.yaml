job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

subtract_accuracy:
  <<: *job_defaults
  command: calc bench accuracy subtract 6 3
  samples: 100000
  max_ulp_error: 2

subtract_latency:
  <<: *job_defaults
  command: calc bench latency subtract 6 3
  samples: 500000
  budget_ns: 250
