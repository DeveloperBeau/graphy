job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

cosh_accuracy:
  <<: *job_defaults
  command: calc bench accuracy cosh 0.5
  samples: 100000
  max_ulp_error: 2

cosh_latency:
  <<: *job_defaults
  command: calc bench latency cosh 0.5
  samples: 500000
  budget_ns: 900
