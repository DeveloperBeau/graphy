job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

gcd_accuracy:
  <<: *job_defaults
  command: calc bench accuracy gcd 6 3
  samples: 100000
  max_ulp_error: 2

gcd_latency:
  <<: *job_defaults
  command: calc bench latency gcd 6 3
  samples: 500000
  budget_ns: 900
