job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

minimum_accuracy:
  <<: *job_defaults
  command: calc bench accuracy minimum 6 3
  samples: 100000
  max_ulp_error: 2

minimum_latency:
  <<: *job_defaults
  command: calc bench latency minimum 6 3
  samples: 500000
  budget_ns: 900
