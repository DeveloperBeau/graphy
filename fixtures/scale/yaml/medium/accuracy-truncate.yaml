job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

truncate_accuracy:
  <<: *job_defaults
  command: calc bench accuracy truncate 0.5
  samples: 100000
  max_ulp_error: 2

truncate_latency:
  <<: *job_defaults
  command: calc bench latency truncate 0.5
  samples: 500000
  budget_ns: 900
