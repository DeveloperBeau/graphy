job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

lcm_accuracy:
  <<: *job_defaults
  command: calc bench accuracy lcm 6 3
  samples: 100000
  max_ulp_error: 2

lcm_latency:
  <<: *job_defaults
  command: calc bench latency lcm 6 3
  samples: 500000
  budget_ns: 900
