job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

atan2_accuracy:
  <<: *job_defaults
  command: calc bench accuracy atan2 6 3
  samples: 100000
  max_ulp_error: 2

atan2_latency:
  <<: *job_defaults
  command: calc bench latency atan2 6 3
  samples: 500000
  budget_ns: 900
