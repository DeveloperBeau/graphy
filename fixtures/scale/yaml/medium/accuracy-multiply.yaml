job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

multiply_accuracy:
  <<: *job_defaults
  command: calc bench accuracy multiply 6 3
  samples: 100000
  max_ulp_error: 2

multiply_latency:
  <<: *job_defaults
  command: calc bench latency multiply 6 3
  samples: 500000
  budget_ns: 250
