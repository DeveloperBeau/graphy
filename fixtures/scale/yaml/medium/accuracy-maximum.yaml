job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

maximum_accuracy:
  <<: *job_defaults
  command: calc bench accuracy maximum 6 3
  samples: 100000
  max_ulp_error: 2

maximum_latency:
  <<: *job_defaults
  command: calc bench latency maximum 6 3
  samples: 500000
  budget_ns: 900
