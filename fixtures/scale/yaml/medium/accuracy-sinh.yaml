job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

sinh_accuracy:
  <<: *job_defaults
  command: calc bench accuracy sinh 0.5
  samples: 100000
  max_ulp_error: 2

sinh_latency:
  <<: *job_defaults
  command: calc bench latency sinh 0.5
  samples: 500000
  budget_ns: 900
