job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

ceil_accuracy:
  <<: *job_defaults
  command: calc bench accuracy ceil 0.5
  samples: 100000
  max_ulp_error: 2

ceil_latency:
  <<: *job_defaults
  command: calc bench latency ceil 0.5
  samples: 500000
  budget_ns: 900
