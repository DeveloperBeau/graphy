job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

hypot_accuracy:
  <<: *job_defaults
  command: calc bench accuracy hypot 6 3
  samples: 100000
  max_ulp_error: 2

hypot_latency:
  <<: *job_defaults
  command: calc bench latency hypot 6 3
  samples: 500000
  budget_ns: 250
