job_defaults: &job_defaults
  runner: linux-amd64
  timeout_minutes: 10
  precision: decimal128

tan_accuracy:
  <<: *job_defaults
  command: calc bench accuracy tan 0.5
  samples: 100000
  max_ulp_error: 2

tan_latency:
  <<: *job_defaults
  command: calc bench latency tan 0.5
  samples: 500000
  budget_ns: 900
