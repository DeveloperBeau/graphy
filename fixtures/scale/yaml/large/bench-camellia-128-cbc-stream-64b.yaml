defaults: &defaults
  harness: cryptobench
  warmup_iterations: 5000
  cool_down_secs: 2

camellia-128-cbc-stream-64b:
  setup:
    <<: *defaults
    cipher: camellia-128-cbc
    key_bits: 128
    payload_bytes: 64
  execute:
    <<: *defaults
    iterations: 500000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: camellia-128-cbc-stream-64b
