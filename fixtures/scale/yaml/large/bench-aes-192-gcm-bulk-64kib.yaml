defaults: &defaults
  harness: cryptobench
  warmup_iterations: 200
  cool_down_secs: 2

aes-192-gcm-bulk-64kib:
  setup:
    <<: *defaults
    cipher: aes-192-gcm
    key_bits: 192
    payload_bytes: 65536
  execute:
    <<: *defaults
    iterations: 20000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: aes-192-gcm-bulk-64kib
