defaults: &defaults
  harness: cryptobench
  warmup_iterations: 5000
  cool_down_secs: 2

des-ede3-cbc-stream-64b:
  setup:
    <<: *defaults
    cipher: des-ede3-cbc
    key_bits: 256
    payload_bytes: 64
  execute:
    <<: *defaults
    iterations: 500000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: des-ede3-cbc-stream-64b
