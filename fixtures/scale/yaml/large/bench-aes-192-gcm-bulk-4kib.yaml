defaults: &defaults
  harness: cryptobench
  warmup_iterations: 1000
  cool_down_secs: 2

aes-192-gcm-bulk-4kib:
  setup:
    <<: *defaults
    cipher: aes-192-gcm
    key_bits: 192
    payload_bytes: 4096
  execute:
    <<: *defaults
    iterations: 100000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: aes-192-gcm-bulk-4kib
