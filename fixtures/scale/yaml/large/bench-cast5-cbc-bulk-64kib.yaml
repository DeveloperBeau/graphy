defaults: &defaults
  harness: cryptobench
  warmup_iterations: 200
  cool_down_secs: 2

cast5-cbc-bulk-64kib:
  setup:
    <<: *defaults
    cipher: cast5-cbc
    key_bits: 256
    payload_bytes: 65536
  execute:
    <<: *defaults
    iterations: 20000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: cast5-cbc-bulk-64kib
