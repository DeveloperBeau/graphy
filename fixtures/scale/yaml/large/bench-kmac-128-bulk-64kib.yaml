defaults: &defaults
  harness: cryptobench
  warmup_iterations: 200
  cool_down_secs: 2

kmac-128-bulk-64kib:
  setup:
    <<: *defaults
    cipher: kmac-128
    key_bits: 128
    payload_bytes: 65536
  execute:
    <<: *defaults
    iterations: 20000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: kmac-128-bulk-64kib
