defaults: &defaults
  harness: cryptobench
  warmup_iterations: 1000
  cool_down_secs: 2

kmac-128-bulk-4kib:
  setup:
    <<: *defaults
    cipher: kmac-128
    key_bits: 128
    payload_bytes: 4096
  execute:
    <<: *defaults
    iterations: 100000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: kmac-128-bulk-4kib
