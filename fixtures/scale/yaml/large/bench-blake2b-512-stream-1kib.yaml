defaults: &defaults
  harness: cryptobench
  warmup_iterations: 2000
  cool_down_secs: 2

blake2b-512-stream-1kib:
  setup:
    <<: *defaults
    cipher: blake2b-512
    key_bits: 512
    payload_bytes: 1024
  execute:
    <<: *defaults
    iterations: 200000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: blake2b-512-stream-1kib
