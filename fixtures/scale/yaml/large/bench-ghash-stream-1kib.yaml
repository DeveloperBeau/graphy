defaults: &defaults
  harness: cryptobench
  warmup_iterations: 2000
  cool_down_secs: 2

ghash-stream-1kib:
  setup:
    <<: *defaults
    cipher: ghash
    key_bits: 256
    payload_bytes: 1024
  execute:
    <<: *defaults
    iterations: 200000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: ghash-stream-1kib
