defaults: &defaults
  harness: cryptobench
  warmup_iterations: 20
  cool_down_secs: 2

camellia-256-cbc-bulk-1mib:
  setup:
    <<: *defaults
    cipher: camellia-256-cbc
    key_bits: 256
    payload_bytes: 1048576
  execute:
    <<: *defaults
    iterations: 2000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: camellia-256-cbc-bulk-1mib
