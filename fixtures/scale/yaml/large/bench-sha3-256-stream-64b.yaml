defaults: &defaults
  harness: cryptobench
  warmup_iterations: 5000
  cool_down_secs: 2

sha3-256-stream-64b:
  setup:
    <<: *defaults
    cipher: sha3-256
    key_bits: 256
    payload_bytes: 64
  execute:
    <<: *defaults
    iterations: 500000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: sha3-256-stream-64b
