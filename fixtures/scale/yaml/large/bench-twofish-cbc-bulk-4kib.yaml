defaults: &defaults
  harness: cryptobench
  warmup_iterations: 1000
  cool_down_secs: 2

twofish-cbc-bulk-4kib:
  setup:
    <<: *defaults
    cipher: twofish-cbc
    key_bits: 256
    payload_bytes: 4096
  execute:
    <<: *defaults
    iterations: 100000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: twofish-cbc-bulk-4kib
