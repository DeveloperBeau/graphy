defaults: &defaults
  harness: cryptobench
  warmup_iterations: 200
  cool_down_secs: 2

xchacha20-poly1305-bulk-64kib:
  setup:
    <<: *defaults
    cipher: xchacha20-poly1305
    key_bits: 256
    payload_bytes: 65536
  execute:
    <<: *defaults
    iterations: 20000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: xchacha20-poly1305-bulk-64kib
