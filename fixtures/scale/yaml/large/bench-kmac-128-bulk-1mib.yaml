defaults: &defaults
  harness: cryptobench
  warmup_iterations: 20
  cool_down_secs: 2

kmac-128-bulk-1mib:
  setup:
    <<: *defaults
    cipher: kmac-128
    key_bits: 128
    payload_bytes: 1048576
  execute:
    <<: *defaults
    iterations: 2000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: kmac-128-bulk-1mib
