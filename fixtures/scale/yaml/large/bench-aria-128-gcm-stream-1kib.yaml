defaults: &defaults
  harness: cryptobench
  warmup_iterations: 2000
  cool_down_secs: 2

aria-128-gcm-stream-1kib:
  setup:
    <<: *defaults
    cipher: aria-128-gcm
    key_bits: 128
    payload_bytes: 1024
  execute:
    <<: *defaults
    iterations: 200000
    cpu_pin: 2
  record:
    <<: *defaults
    database: results/crypto.db
    run_label: aria-128-gcm-stream-1kib
