schema_rev = 3
suite = "cipher-matrix"

[run.blake2b_512_bulk_1mib]
primitive = "blake2b-512"
kind_of_primitive = "digest"
workload = "bulk-1mib"
payload_bytes = 1048576
iterations = 2000
warmup_iterations = 20

[keying]
key_bits = 512
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
