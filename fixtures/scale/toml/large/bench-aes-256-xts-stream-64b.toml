schema_rev = 3
suite = "cipher-matrix"

[run.aes_256_xts_stream_64b]
primitive = "aes-256-xts"
kind_of_primitive = "cipher"
workload = "stream-64b"
payload_bytes = 64
iterations = 500000
warmup_iterations = 5000

[keying]
key_bits = 256
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
