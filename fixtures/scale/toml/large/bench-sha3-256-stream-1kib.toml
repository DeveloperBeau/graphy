schema_rev = 3
suite = "cipher-matrix"

[run.sha3_256_stream_1kib]
primitive = "sha3-256"
kind_of_primitive = "digest"
workload = "stream-1kib"
payload_bytes = 1024
iterations = 200000
warmup_iterations = 2000

[keying]
key_bits = 256
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
