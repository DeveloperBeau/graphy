schema_rev = 3
suite = "cipher-matrix"

[run.aes_128_ctr_bulk_64kib]
primitive = "aes-128-ctr"
kind_of_primitive = "cipher"
workload = "bulk-64kib"
payload_bytes = 65536
iterations = 20000
warmup_iterations = 200

[keying]
key_bits = 128
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
