schema_rev = 3
suite = "cipher-matrix"

[run.hmac_sha256_bulk_4kib]
primitive = "hmac-sha256"
kind_of_primitive = "mac"
workload = "bulk-4kib"
payload_bytes = 4096
iterations = 100000
warmup_iterations = 1000

[keying]
key_bits = 256
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
