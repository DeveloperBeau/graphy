schema_rev = 3
suite = "cipher-matrix"

[run.kmac_128_bulk_4kib]
primitive = "kmac-128"
kind_of_primitive = "digest"
workload = "bulk-4kib"
payload_bytes = 4096
iterations = 100000
warmup_iterations = 1000

[keying]
key_bits = 128
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
