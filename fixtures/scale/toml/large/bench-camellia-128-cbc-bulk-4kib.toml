schema_rev = 3
suite = "cipher-matrix"

[run.camellia_128_cbc_bulk_4kib]
primitive = "camellia-128-cbc"
kind_of_primitive = "cipher"
workload = "bulk-4kib"
payload_bytes = 4096
iterations = 100000
warmup_iterations = 1000

[keying]
key_bits = 128
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
