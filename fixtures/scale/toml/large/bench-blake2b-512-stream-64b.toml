schema_rev = 3
suite = "cipher-matrix"

[run.blake2b_512_stream_64b]
primitive = "blake2b-512"
kind_of_primitive = "digest"
workload = "stream-64b"
payload_bytes = 64
iterations = 500000
warmup_iterations = 5000

[keying]
key_bits = 512
rotate_interval = 10000
zeroize_after = true

[recording]
database = "results/crypto.db"
table_name = "runs"
flush_every = 500
